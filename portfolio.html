    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; color: #333; background-color: #f1f3f5; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: #1a2b4c; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo img { height: 50px; }
        nav a { text-decoration: none; color: #333; margin: 0 15px; font-weight: 600; text-transform: uppercase; font-size: 14px; }
        nav a:hover { color: #1a2b4c; }
        .portfolio-header { text-align: center; padding: 60px 20px 20px; }
        .portfolio-header h1 { color: #1a2b4c; font-size: 36px; margin-bottom: 10px; }
        .portfolio-header p { color: #666; font-size: 18px; }
        .gallery-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px 80px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .gallery-item { overflow: hidden; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background-color: #000; }
        .gallery-item img { width: 100%; height: 300px; object-fit: cover; display: block; transition: transform 0.4s ease, opacity 0.4s ease; }
        .gallery-item:hover img { transform: scale(1.1); opacity: 0.8; }
        @media (max-width: 768px) {
            header { flex-direction: column; padding: 15px 20px; gap: 15px; }
            .logo { font-size: 20px; text-align: center; flex-direction: column; }
            .logo img { height: 40px !important; }
            nav a { margin: 0 5px; font-size: 12px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
        }
    </style>
</head>
